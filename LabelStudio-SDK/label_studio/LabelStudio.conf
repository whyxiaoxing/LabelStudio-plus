; Label Studio 服务端配置。
; 本文件取代了原先的命令行参数，命令行只保留子命令，例如 `label-studio start`、`label-studio export`。
; 值留空表示使用内置默认值。注释必须独占一行，值后面不能跟行内注释（会被当成值的一部分）。
; 文件按 UTF-8 读写。

[Server]

; ---- 网络与运行 ----

; 用于生成导入任务链接、示例任务链接、静态资源地址的完整主机名。
; 示例：https://77.42.77.42:1234、http://ls.domain.com/subdomain/
host =

; Web 服务内部监听地址，例如 localhost 或 0.0.0.0
internal_host = 127.0.0.1

; Web 服务端口，若该端口已被占用会自动向后寻找可用端口
port = 8002

; 调试模式
debug = True

; 启动 Label Studio 时不自动打开浏览器
no_browser = True

; 日志级别：DEBUG、INFO、WARNING、ERROR
log_level = WARNING

; ---- 存储与数据库 ----

; 存放任务与标注结果的数据库文件路径
database =

; 存放应用全部相关数据的目录
data_dir =

; 标注配置（label config）文件路径
label_config =

; HTTPS 证书文件（PEM 格式）。推荐改用 nginx 等服务器来做 SSL，此处通常留空
cert_file =

; HTTPS 私钥文件（PEM 格式）
key_file =

; ---- 默认用户 ----

username =
password =
user_token =
enable_legacy_api_token = false

; 静默模式：init 时不询问用户名与密码
quiet_mode = false

; ---- 项目与 ML 后端 ----

; 命令行未给出子命令时使用的子命令，留空表示直接启动服务
command =

; 项目状态初始化所在目录
project_name =

; 用于标识项目的项目描述
project_desc =

; 标注任务的抽样顺序：sequential、uniform、prediction-score-min
sampling = sequential

; 机器学习后端 URL，多个用逗号分隔，例如 localhost:8080,localhost:8081
ml_backends =

; 若项目尚未初始化则先初始化
init = false

; 打印 Label Studio 版本信息后退出
version = false

; 统计信息从头重新计算
from_scratch = false

; ---- export 子命令 ----

; 要导出的项目 ID
project_id =

; 导出格式（JSON、JSON_MIN、CSV 等）
export_format =

; 导出文件路径或目录，留空则使用数据目录下的 export 目录
export_path =

; 导出序列化上下文
export_serializer_context = {"annotations__completed_by": {"only_id": null}, "interpolate_key_frames": true}
